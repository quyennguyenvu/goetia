appId: com.quyennguyenvu.goetia
productName: Goetia
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - resources/**
  - package.json
icon: resources/icon.png
mac:
  target: dmg
  category: public.app-category.social-networking
  artifactName: ${productName}-${version}-${arch}.${ext}
  # ad-hoc sign: macOS refuses Notification Center registration for unsigned
  # bundles (notifications fail with UNErrorDomain 1, no permission prompt)
  identity: '-'
win:
  target: nsis
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
publish: null
