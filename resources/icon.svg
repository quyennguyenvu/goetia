<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Goetia app icon — "Ember Portal v2"
       Squircle graphite plate, ring of fire sweeping red→orange→yellow,
       dissolving into embers, around a white-hot core. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1A1F28"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="arcA" gradientUnits="userSpaceOnUse" x1="77.5" y1="42.8" x2="18.7" y2="54.2">
      <stop offset="0" stop-color="#E23D28"/>
      <stop offset="1" stop-color="#FF7A1F"/>
    </linearGradient>
    <linearGradient id="arcB" gradientUnits="userSpaceOnUse" x1="18.7" y1="54.2" x2="53.2" y2="18.5">
      <stop offset="0" stop-color="#FF7A1F"/>
      <stop offset="1" stop-color="#FFD34D"/>
    </linearGradient>
    <radialGradient id="coreg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#FFF6CE"/>
      <stop offset="0.35" stop-color="#FFCE5A"/>
      <stop offset="0.7" stop-color="#FF9E2C"/>
      <stop offset="1" stop-color="#F0663A"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>

  <rect x="62" y="62" width="900" height="900" rx="200" fill="url(#plate)"/>
  <rect x="64" y="64" width="896" height="896" rx="198" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3"/>

  <g transform="translate(152,152) scale(7.5)">
    <!-- halo -->
    <g filter="url(#soft)" opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M77.55 42.79 A30 30 0 0 1 18.66 54.24" stroke="url(#arcA)" stroke-width="12"/>
      <path d="M18.66 54.24 A30 30 0 0 1 53.21 18.45" stroke="url(#arcB)" stroke-width="12"/>
    </g>
    <!-- ring -->
    <path d="M77.55 42.79 A30 30 0 0 1 18.66 54.24"
          fill="none" stroke="url(#arcA)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M18.66 54.24 A30 30 0 0 1 53.21 18.45"
          fill="none" stroke="url(#arcB)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- dissolve trail -->
    <circle cx="59.2" cy="20.2" r="3.4" fill="#FFD34D"/>
    <circle cx="67.3" cy="25" r="2.5" fill="#FFCB45" opacity="0.8"/>
    <circle cx="73.2" cy="31.7" r="1.8" fill="#FFC13D" opacity="0.55"/>
    <!-- core -->
    <circle cx="48" cy="48" r="13" fill="#FF8A2A" opacity="0.45" filter="url(#softer)"/>
    <circle cx="48" cy="48" r="7" fill="url(#coreg)"/>
    <circle cx="48" cy="46.5" r="2.6" fill="#FFFBEA" opacity="0.95"/>
  </g>
</svg>
