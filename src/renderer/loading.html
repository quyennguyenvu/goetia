<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <title>Goetia — waking</title>
    <style>
      /* Critical first-paint styles. Dev serves this file from source,
         where loading.css/tokens.css only arrive via the JS module —
         after first paint — and a viewBox-only SVG defaults to full body
         width: the portal flashes huge and uncentered. Mirrors
         loading.css/tokens.css; var() fallbacks are the pre-theme light
         values and yield to the real tokens once loaded. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      .stage {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--bg-0, #f7f8fa);
      }
      .portal {
        width: 128px;
        height: 128px;
      }
      .caption {
        color: var(--text-2, #5a6472);
        font-family: var(--font-sans, system-ui, sans-serif);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <svg class="portal" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient
            id="arcA"
            gradientUnits="userSpaceOnUse"
            x1="77.5"
            y1="42.8"
            x2="18.7"
            y2="54.2"
          >
            <stop offset="0" stop-color="#E23D28" />
            <stop offset="1" stop-color="#FF7A1F" />
          </linearGradient>
          <linearGradient
            id="arcB"
            gradientUnits="userSpaceOnUse"
            x1="18.7"
            y1="54.2"
            x2="53.2"
            y2="18.5"
          >
            <stop offset="0" stop-color="#FF7A1F" />
            <stop offset="1" stop-color="#FFD34D" />
          </linearGradient>
          <radialGradient id="coreg" cx="0.5" cy="0.42" r="0.75">
            <stop offset="0" stop-color="#FFF6CE" />
            <stop offset="0.35" stop-color="#FFCE5A" />
            <stop offset="0.7" stop-color="#FF9E2C" />
            <stop offset="1" stop-color="#F0663A" />
          </radialGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.2" />
          </filter>
          <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="5.5" />
          </filter>
        </defs>
        <g class="ring">
          <g filter="url(#soft)" opacity="0.5" fill="none" stroke-linecap="round">
            <path
              d="M77.55 42.79 A30 30 0 0 1 18.66 54.24"
              stroke="url(#arcA)"
              stroke-width="12"
            />
            <path
              d="M18.66 54.24 A30 30 0 0 1 53.21 18.45"
              stroke="url(#arcB)"
              stroke-width="12"
            />
          </g>
          <path
            d="M77.55 42.79 A30 30 0 0 1 18.66 54.24"
            fill="none"
            stroke="url(#arcA)"
            stroke-width="6.5"
            stroke-linecap="round"
          />
          <path
            d="M18.66 54.24 A30 30 0 0 1 53.21 18.45"
            fill="none"
            stroke="url(#arcB)"
            stroke-width="6.5"
            stroke-linecap="round"
          />
          <circle class="ember ember-1" cx="59.2" cy="20.2" r="3.4" fill="#FFD34D" />
          <circle class="ember ember-2" cx="67.3" cy="25" r="2.5" fill="#FFCB45" opacity="0.8" />
          <circle class="ember ember-3" cx="73.2" cy="31.7" r="1.8" fill="#FFC13D" opacity="0.55" />
        </g>
        <g class="core">
          <circle
            cx="48"
            cy="48"
            r="13"
            fill="#FF8A2A"
            opacity="0.45"
            filter="url(#softer)"
          />
          <circle cx="48" cy="48" r="7" fill="url(#coreg)" />
          <circle cx="48" cy="46.5" r="2.6" fill="#FFFBEA" opacity="0.95" />
        </g>
      </svg>
      <p class="caption" id="caption">Waking…</p>
    </main>
    <script type="module" src="/src/loading.ts"></script>
  </body>
</html>
