<!-- /direct/inbox logged in, one thread open, two unread (captured 2026-08-29).
     Thread rows are div[role=button] inside the Thread list nav — no anchors,
     no per-thread URL. An unread row bolds its name and preview (StyleX
     x1s688f = 600; read rows carry 400) and fills its trailing slot with the
     blue dot plus a clipped "Unread" label; a read row's slot is empty. The
     open thread is the aria-pressed row. With something unread the rail's
     Messages link repoints from /direct/inbox/ to that thread and gains a
     count badge — the one a[href*='/direct/t/'] on the page. -->
