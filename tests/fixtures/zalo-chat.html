<title>Zalo</title>
<!-- Shape of the logged-in chat.zalo.me DOM (2026-08-28 dump), synthetic
     content. The open conversation is named in the chat header's
     .header-title; the list is a ReactVirtualized grid of .msg-item rows whose
     name is .conv-item-title__name — NBSP-joined, behind a community icon,
     and on a custom tag (div-b16). Zalo ignores synthetic clicks, so the
     recipe reports a row's centre for main to click. -->
